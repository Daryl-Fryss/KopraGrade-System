name: kopragrade
description: KopraGrade - copra drying-quality grading app (Flutter for web and mobile).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.8.0
  image_picker: ^1.1.2
  camera: ^0.11.3 # live camera for the Scan Copra screen (phones only)
  shared_preferences: ^2.3.2
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
